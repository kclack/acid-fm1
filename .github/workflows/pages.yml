name: Test and publish emulator
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install host-test prerequisites
        run: python3 -m pip install pillow fonttools
      - name: Native engine and FM1-panel tests
        run: sh tools/test.sh
      - name: Verify checked-in WebAssembly
        run: node tests/wasm_test.mjs
  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4
